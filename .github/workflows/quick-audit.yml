name: Quick audit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  exact-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Compile Python sources
        run: |
          python -m py_compile \
            computations/*.py \
            scripts/*.py \
            lean/*.py

      - name: Validate proof DAG syntax
        run: |
          ruby - <<'RUBY'
          require "yaml"
          dag = YAML.safe_load(
            File.read("docs/proof-dag.yaml"),
            permitted_classes: [],
            aliases: false
          )
          nodes = dag.fetch("nodes")
          ids = nodes.map { |node| node.fetch("id") }
          abort "duplicate proof-DAG node" unless ids.uniq.length == ids.length
          dependency_edges = nodes.flat_map do |node|
            node.fetch("dependencies").map { |dependency| [dependency, node.fetch("id")] }
          end
          declared_edges = dag.fetch("edges").map { |edge| [edge.fetch("from"), edge.fetch("to")] }
          expected_edges = dependency_edges + [["V0", "P848"]]
          abort "proof-DAG edge list disagrees with node dependencies" unless declared_edges.sort == expected_edges.sort
          puts "PROOF DAG STRUCTURE PASSED"
          RUBY

      - name: Retrieve pinned high-range source
        run: |
          mkdir -p sources/cache
          curl -L --fail --silent --show-error \
            'https://drive.usercontent.google.com/download?id=1ujhm4_WYpgRV_rd1rJXIfHyvx16COEKe&export=download&confirm=t' \
            -o sources/cache/sothanaphan-2.64e17.pdf
          echo '8162113a571dc2283fc77de1cdf36e7abf424eeec952aa27cf82a4f44b3a796f  sources/cache/sothanaphan-2.64e17.pdf' \
            | sha256sum --check --strict

      - name: Run root manifest and resume controls
        run: |
          python -B computations/test_all_n_manifest.py
          python -B computations/test_all_n_resume.py
          python -B lean/test_completion_gate.py
          python -B diagnostics/run_cached_lean_canary.py --self-test

      - name: Verify canonical prefix certificate
        run: |
          python -B computations/check_prefix_certificate.py \
            certificates/prefix-10000.json \
            --expected-sha256 \
            693ce882fb3f3786caf8eb502dd0677f42a4ed687adaa71a613b27ad7ef49727
          python -B computations/test_prefix_checker.py \
            certificates/prefix-10000.json
          python -B computations/exhaustive_small_prefix.py --limit 100

      - name: Check tracked diff hygiene
        run: git diff --check 4b825dc642cb6eb9a060e54bf8d69288fbee4904 HEAD
