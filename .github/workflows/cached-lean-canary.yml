name: Cache-backed Lean canary

on:
  workflow_dispatch:
  push:
    branches:
      - lean-host-diagnostic

permissions:
  contents: read

concurrency:
  group: cache-backed-lean-canary
  cancel-in-progress: false

jobs:
  canary:
    if: >-
      github.ref == 'refs/heads/lean-host-diagnostic' &&
      (github.event_name == 'workflow_dispatch' ||
       contains(github.event.head_commit.message, '[cache-canary]'))
    runs-on: windows-2025
    timeout-minutes: 350
    steps:
      - name: Check out diagnostic branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Select pinned Python series
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          architecture: x64

      - name: Run bounded fail-closed controls
        shell: pwsh
        run: python -B diagnostics/run_cached_lean_canary.py --self-test

      - name: Prepare exact upstream and Lean runtime
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          git config --global core.longpaths true

          $upstream = Join-Path $env:RUNNER_TEMP "e848-cache-canary-upstream"
          $runtimeRoot = Join-Path $env:RUNNER_TEMP "e848-lean-runtime"
          $runtimeZip = Join-Path $env:RUNNER_TEMP "lean-4.30.0-rc2-windows.zip"
          foreach ($path in @($upstream, $runtimeRoot, $runtimeZip)) {
            if (Test-Path -LiteralPath $path) {
              throw "fresh diagnostic path unexpectedly exists: $path"
            }
          }

          & git clone --filter=blob:none --no-checkout `
            https://github.com/crabsatellite/erdos-848-squarefree-product.git `
            $upstream
          if ($LASTEXITCODE -ne 0) {
            throw "upstream clone failed with exit code $LASTEXITCODE"
          }
          & git -C $upstream checkout --detach `
            bb8e1b10b0066639ee3440ba983c3f9774667d42
          if ($LASTEXITCODE -ne 0) {
            throw "cache-origin checkout failed with exit code $LASTEXITCODE"
          }

          & curl.exe `
            --proto "=https" `
            --tlsv1.2 `
            --location `
            --fail `
            --silent `
            --show-error `
            --retry 5 `
            --retry-delay 5 `
            --retry-all-errors `
            --output $runtimeZip `
            https://github.com/leanprover/lean4/releases/download/v4.30.0-rc2/lean-4.30.0-rc2-windows.zip
          if ($LASTEXITCODE -ne 0) {
            throw "Lean runtime download failed with exit code $LASTEXITCODE"
          }
          $runtimeSha = (Get-FileHash -LiteralPath $runtimeZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($runtimeSha -cne "cb0688631203ac7832e447a5791e51e88db938b6038ff788eea73491619988b2") {
            throw "Lean runtime SHA-256 mismatch: $runtimeSha"
          }
          [void](New-Item -ItemType Directory -Path $runtimeRoot)
          & tar.exe -xf $runtimeZip -C $runtimeRoot
          if ($LASTEXITCODE -ne 0) {
            throw "Lean runtime extraction failed with exit code $LASTEXITCODE"
          }

          "E848_CANARY_UPSTREAM=$upstream" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "E848_CANARY_RUNTIME_ROOT=$runtimeRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "E848_CANARY_RUNTIME_ZIP=$runtimeZip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install all shards and run live trust-zero canary
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $receipt = Join-Path $env:RUNNER_TEMP "e848-cache-canary-receipt"
          $scratch = Join-Path $env:RUNNER_TEMP "e848-cache-canary-assets"
          python -B diagnostics/run_cached_lean_canary.py `
            --upstream-root $env:E848_CANARY_UPSTREAM `
            --runtime-root $env:E848_CANARY_RUNTIME_ROOT `
            --runtime-archive $env:E848_CANARY_RUNTIME_ZIP `
            --receipt-dir $receipt `
            --scratch-dir $scratch `
            --memory-mib 24576

      - name: Publish explicit claim boundary
        if: always()
        shell: pwsh
        run: |
          @"
          # Cache-backed Lean canary

          This diagnostic authenticates the release cache and performs live
          trust-zero provider, root theorem, axiom, and dependency checks.

          It does **not** perform or certify the required clean source build and
          cannot promote L1, L2, RCLEAN, V0, or P848.
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload receipt and raw logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cached-lean-canary-receipt
          path: ${{ runner.temp }}/e848-cache-canary-receipt
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
