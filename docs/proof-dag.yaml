  - id: P13PRIME
    kind: exact_batch_primality
    statement: Every factor in the authenticated lower-p13 transcript is prime and every row multiplies exactly to z^2+1.
    dependencies: [S0]
    source: [computations/check_p13_factor_primality.py, certificates/p13-factor-primality.json, docs/computation-spec.md]
    status: proved
    formalized: false
    explicit_constants:
      transcript_rows: 1439686
      max_factor: 2958540704271709
      sieve_limit: 54392469
      certificate_sha256: cb67a19e9edfc21206b6ec0c886bf6aa67b97a110296f7e20bf00bdf818cfc64
    key_original_step: Sieve every prime through the square root of the largest claim and prove the large-factor product coprime to that primorial.
  - id: IP_LOW
    kind: structural_rational_range
    statement: All three R0 branches satisfy the target for every 1000000000 <= N <= 1000000000000.
    dependencies: [R0]
    source: [external/erdos-848-all-n/proofs/P13_DIRECT_RESIDUAL.md, external/erdos-848-all-n/proofs/LOW_RANGE_DIRECT_ENVELOPES.md]
