version: 8
target:
  id: P848
  statement_ref: docs/problem-spec.md
  status: open
nodes:
  - id: S0
    kind: statement_audit
    statement: The target is the source-faithful all-positive-N, diagonal-inclusive cardinality bound with benchmark B_7(N).
    dependencies: []
    source: [docs/problem-spec.md, docs/source-audit.md]
    status: proved
    formalized: true
    explicit_constants: {}
    key_original_step: Resolve the original positive-integer scope and the maintained clarification that a=b is included.
  - id: E0
    kind: elementary_lower_bound
    statement: A_7(N) is admissible and has cardinality floor((N+18)/25) for every positive N.
    dependencies: [S0]
    source: [docs/problem-spec.md, docs/proof-ledger.md]
    status: proved
    formalized: true
    explicit_constants: {modulus: 25, residue: 7}
    key_original_step: For a,b congruent to 7 modulo 25, 25 divides ab+1.
  - id: H0
    kind: analytic_high_range
    statement: The target upper bound holds for every N at least 264000000000000000.
    dependencies: [S0]
    source: [sources/cache/sothanaphan-2.64e17.pdf, docs/source-audit.md]
    status: proved
    formalized: false
    explicit_constants:
      threshold: 264000000000000000
      source_sha256: 8162113a571dc2283fc77de1cdf36e7abf424eeec952aa27cf82a4f44b3a796f
      numerical_claims_sha256: 4726814d80fc63353a77c18bac8691bc917efd5ef1c7dcf10a14aed03674b215
    key_original_step: Combine exact progression and diagonal estimates in four exhaustive residue cases; use Corollary 2 only for admissible A.
  - id: R0
    kind: structural_reduction
    statement: The no-outsider, least-witness-13, and least-witness-at-least-17 cases are exhaustive, and each outsider case obeys the stated order-statistic rank bound.
    dependencies: [S0]
    source: [external/erdos-848-all-n/proofs/ALL_N_THEOREM.md, docs/artifact-audit.md]
    status: proved
    formalized: false
    explicit_constants: {least_outsider_witnesses: [13, 17]}
    key_original_step: Bound every admissible set by t plus the t-th decreasing outsider score.
  - id: RPELL
    kind: repaired_generalized_pell_normalization
    statement: The large-root translated-pair count normalizes to 50*tau(abs(Delta))*K(B)*B/Y^2 without dropping a factor B/N.
    dependencies: [R0]
    source: [proof/structural-certificate-appendix.md, proof/final-proof.md, docs/failed-lemmas.md]
    status: proved
    formalized: false
    explicit_constants: {}
    key_original_step: Use x and x+d at most N to obtain an actual-N square bound, divide by N/25, and only then replace N by B; FL-013 records the invalid endpoint-square shortcut.
  - id: F10K
    kind: exact_prefix_crosscheck
    statement: The target holds for every 1 <= N <= 10000.
    dependencies: [S0, E0]
    source: [certificates/prefix-10000.json, docs/computation-spec.md]
    status: proved
    formalized: false
    explicit_constants:
      limit: 10000
      certificate_sha256: 693ce882fb3f3786caf8eb502dd0677f42a4ed687adaa71a613b27ad7ef49727
    key_original_step: Properly color every constant-benchmark prefix block and check every same-color product by independent factorization.
  - id: IP_FIN
    kind: exact_finite_coloring
    statement: Exact coloring certificates prove the target for every 1 <= N <= 100000006.
    dependencies: [S0, E0]
    source: [proof/final-proof.md, computations/independent_check_finite_stream.cpp, certificates/finite-factor-leaves.json, certificates/finite-stream-replay-2026-08-10.md]
    status: proved
    formalized: false
    explicit_constants: {upper: 100000006}
    key_original_step: Reconstruct every diagonal vertex and maintain a proper coloring at every critical endpoint.
  - id: IP_LOWER
    kind: structural_exact_range
    statement: All three R0 branches satisfy the target for every 100000000 <= N <= 1000000000.
    dependencies: [R0, P13PRIME]
    source: [external/erdos-848-all-n/proofs/P13_INTERVAL_100M_1B.md, external/erdos-848-all-n/proofs/P17_EXACT_HYBRID.md]
